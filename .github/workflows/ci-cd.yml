name: CI/CD

# PR  : jalankan tes + coba build image Docker.
# main: tes, build & push image ke GitHub Container Registry, lalu deploy ke VPS lewat SSH
#       (deploy dilewati jika secret VPS_HOST belum diisi).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependency
        run: pip install -r backend/requirements.txt
      - name: Jalankan tes
        working-directory: backend
        env:
          DATA_SOURCE: mock
        run: pytest -q
      - name: Uji cepat server (mode simulasi)
        working-directory: backend
        env:
          DATA_SOURCE: mock
          NEWS_SOURCES: ""
        run: |
          uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/config > /dev/null && break; sleep 1; done
          python ../scripts/smoke_test.py --ai || { cat /tmp/uvicorn.log; exit 1; }

  image:
    name: Build image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Nama image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login ke GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (dan push di main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke VPS
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || 'ai-trading' }}
      APP_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - name: Cek secret
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::notice::Secret VPS_HOST / VPS_USER / VPS_SSH_KEY belum diisi, deploy dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - name: Siapkan kunci SSH
        if: steps.check.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS kosong, memakai ssh-keyscan (kurang aman)."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
      - name: Kirim file compose ke VPS
        if: steps.check.outputs.skip != 'true'
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $VPS_PORT"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/deploy'"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" docker-compose.yml "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/remote-deploy.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/deploy/"
      - name: Jalankan versi baru
        if: steps.check.outputs.skip != 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token GHCR dikirim lewat stdin agar tidak muncul di daftar proses VPS
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && APP_IMAGE='$APP_IMAGE' GHCR_USER='$GHCR_USER' bash deploy/remote-deploy.sh"
      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
